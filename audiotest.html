<!DOCTYPE html>

<canvas width=128 height=128 id="can"></canvas>
<script>
c = can.getContext("2d")

function Plot(arr){
    c.fillStyle="#000"
    c.strokeStyle="#FFF"
    c.fillRect(0,0,128,128)
    for(n=0;n<127;n++){
        c.beginPath()
        c.moveTo(n,64-arr[n])
        c.lineTo(n+1,64-arr[n+1])
        c.stroke()
    }
}
